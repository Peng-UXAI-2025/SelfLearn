<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Web Notebook</title>

    <!-- Core Libraries -->
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.4.120/build/pdf.min.js"></script>
    <script src="https://unpkg.com/mammoth@1.4.21/mammoth.browser.min.js"></script>

    <!-- Environment Variables (API Keys) -->
    <script src="env.js"></script>

    <!-- Styling -->
    <link rel="stylesheet" href="css/main.css" />
    <link rel="stylesheet" href="css/knowledge-tree.css" />
    <link rel="stylesheet" href="css/pdf-processor.css" />
    <link rel="stylesheet" href="css/clipboard.css" />
    <link rel="stylesheet" href="css/clipboard-copilot.css" />
    <link rel="stylesheet" href="css/study-spaces.css" />
    <link rel="stylesheet" href="css/left-sidebar.css" />
    <link rel="stylesheet" href="css/knowledge-tree.css">

  </head>
  <body>
    <div class="header">
      <div class="breadcrumb">
        <span class="file-title">Untitled Document</span>
      </div>
      <div class="toolbar-placeholder">
        <div class="formatting-tools">
          <button class="tool-button" title="Bold"><strong>B</strong></button>
          <button class="tool-button" title="Italic"><em>I</em></button>
          <button class="tool-button" title="Underline"><u>U</u></button>
          <span class="tool-separator">|</span>
          <button class="tool-button" title="Heading 1">H1</button>
          <button class="tool-button" title="Heading 2">H2</button>
          <button class="tool-button" title="Heading 3">H3</button>
          <span class="tool-separator">|</span>
          <button class="tool-button" title="Bullet List">•</button>
          <button class="tool-button" title="Numbered List">1.</button>
          <button class="tool-button" title="To-do List">☑</button>
          <span class="tool-separator">|</span>
          <button class="tool-button" title="Add Link">
            <span class="link-icon">🔗</span>
          </button>
          <button class="tool-button" title="Add Image">
            <span class="image-icon">🖼️</span>
          </button>
        </div>
      </div>
      <div class="ai-tools-dropdown">
        <button id="ai-tools-btn">AI TOOLS</button>
        <div class="dropdown-content" id="ai-dropdown">
          <button id="pdf-tree-btn">PDF Knowledge Tree</button>
          <button id="clipboard-copilot-btn">Clipboard Copilot</button>
          <button id="notes-tree-btn">Notes Tree Generator</button>
          <!-- API Settings button will be added dynamically by JavaScript -->
        </div>
      </div>
    </div>

    <div class="content">
      <div class="title-area">
        <h1 contenteditable="true" id="document-title">Untitled Document</h1>
      </div>
      <div class="body-area">
        <div contenteditable="true" id="document-body">
          <p>Start writing your document here...</p>
        </div>
      </div>
    </div>

    <!-- PDF Knowledge Tree Window Template (Initially Hidden) -->
    <div id="pdf-knowledge-window" class="ai-window" style="display: none">
      <!-- PDF Knowledge Tree Window content omitted for brevity -->
    </div>

    <!-- Clipboard Copilot Window Template (Initially Hidden) -->
    <div id="clipboard-copilot-window" class="ai-window" style="display: none">
      <!-- Clipboard Copilot Window content omitted for brevity -->
    </div>

    <!-- Notes Tree Generator Window Template (Initially Hidden) -->
    <div id="notes-tree-window" class="ai-window" style="display: none">
      <!-- Notes Tree Generator Window content omitted for brevity -->
    </div>

    <!-- Script Initialization for Local Storage Check -->
    <script>
      // Initialization script to check and fix any corrupted data on page load
      document.addEventListener("DOMContentLoaded", function () {
        // Check for corrupted webNotebookDocument
        try {
          const storageKey = "webNotebook_webNotebookDocument";
          const docData = localStorage.getItem(storageKey);

          // Try to parse the data
          try {
            JSON.parse(docData);
          } catch (e) {
            // If it can't be parsed, remove it
            console.warn("Found corrupted document data, removing it");
            localStorage.removeItem(storageKey);
          }
        } catch (e) {
          // Something went wrong with the check itself
          console.error("Error checking storage:", e);
        }

        // Initialize custom events for module communication
        window.webNotebookEvents = {
          documentSaved: new Event("webnotebook:document-saved"),
          treeGenerated: new Event("webnotebook:tree-generated"),
        };
      });
    </script>

    <!-- Application Scripts -->
    <script src="js/utils.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/knowledge-tools/knowledge-api.js"></script>
    <script src="js/knowledge-tools/tree-generator.js"></script>
    <script src="js/knowledge-tools/tree-visualizer.js"></script>
    <script src="js/pdf-tools/pdf-parser.js"></script>
    <script src="js/pdf-tools/pdf-processor.js"></script>
    <script src="js/clipboard-tools/clipboard-monitor.js"></script>
    <script src="js/clipboard-tools/text-processor.js"></script>
    
    <!-- Important: Add knowledge-tree-nav.js before study-spaces.js -->
    <script src="js/knowledge-tree-nav.js"></script>
    
    <script src="js/study-spaces.js"></script>
    <script src="js/left-sidebar.js"></script>
    <script src="js/app.js"></script>
    
    <!-- Fallback initialization for knowledge tree navigation -->
    <script>
      // Initialize the knowledge tree navigation after page load
      document.addEventListener('DOMContentLoaded', function() {
        if (window.knowledgeTree && typeof window.knowledgeTree.initialize === 'function' && 
            !window.knowledgeTreeInitialized) {
          window.knowledgeTree.initialize();
          window.knowledgeTreeInitialized = true;
          console.log("Knowledge tree navigation initialized from index.html");
        }
      });
    </script>
  </body>
</html>
